<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
</head>

<body>

    <form action="/edit/{{ user[0] }}" method="POST" class="mb-4">
        <!-- Campo oculto para asegurar que pase el ID -->
        <input type="hidden" name="id" value="{{ user[0] }}">

        <div class="row g-3">
            <div class="col-md-5">
                <input type="text" name="name" class="form-control" value="{{ user[1] }}" required>
            </div>
            <div class="col-md-5">
                <input type="email" name="email" class="form-control" value="{{ user[2] }}" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">ACTUALIZAR</button>
            </div>
        </div>
    </form>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>

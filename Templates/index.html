<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center> <h1>inicio de sesion con python<h1> </center>
        <form action="/add" method="post">
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Ingrese su nombre</label>
    <input type="text" class="form-control" name="name" placeholder="ingrese su nombre">
    <div id="emailHelp" class="form-text"></div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Correo electronico</label>
    <input type="email" class="form-control" name="email" placeholder="Ingrese su correo">
  </div>
  
  <button type="submit" class="btn btn-primary">Registrarse</button>
  <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Correo</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr>
        {% for u in user %}
      <th scope="row">{{ u[0] }}</th>
      <td>{{ u[1] }}</td>
      <td>{{ u[2] }}</td>
      <td>
        <a href="/edit/{{u[0]}}" class="btn btn-warning">Editar</a>
          
        <a href="/delete/{{u[0]}}" class="btn btn-danger">Eliminar</a>
      </td>

    </tr>
    {% endfor %}
    
  </tbody>
</table>
</form>

</body>
</html>

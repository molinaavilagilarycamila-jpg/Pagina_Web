<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

<center> <h1>Inicio de Sesion Crud Con python </h1> </center>

<form action="/add" method="POST" clas="mb-4">
    <div class="col-md-8 o col-md-6">
        <b> <label for="exampleInputEmail1" class="form-label">Ingrese su Nombre de usuario</label></b>
        <input type="name" class="form-control" name="name" placeholder="Nombre" required>
    </div>
    <div class="col-md-8 o col-md-6">
        <b><label for="exampleInputPassword1" class="form-label">Correo Electronico</label> </b>
        <input type="email" class="form-control" name="email" placeholder="email" required>
    </div>

    <button type="submit" class="btn btn-success">Registrar Usuario</button>
</form>

</center>

<!-- Formulario de Búsqueda -->
<h1>BUSQUEDA DE REGISTRO</h1>
<form action="/search" method="GET" class="d-flex">
    <input type="text" name="q" class="form-control me-2" placeholder="Buscar..." value="{{ busqueda or '' }}">
    <button type="submit" class="btn btn-outline-success">Buscar</button>
</form>

<table class="table">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre</th>
            <th scope="col">Correo</th>
            <th scope="col">ACCIONES</th>
        </tr>
    </thead>
    <tbody>
        {% for u in user %}
        <tr>
            <th scope="row">{{ u[0] }}</th>
            <td>{{ u[1] }}</td>
            <td>{{ u[2] }}</td>
            <td>
                <a href="/edit/{{ u[0] }}" class="btn btn-success">EDITAR</a>

                <a href="/delete/{{ u[0] }}" class="btn btn-warning" onclick="return confirm('¿Estás seguro de que deseas eliminar este registro?');">ELIMINAR</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/twtIaxVXM"
    crossorigin="anonymous"></script>
</body>

</html>
